plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sanjay.bsebmath10'
    compileSdk 34

    defaultConfig {
        applicationId "com.sanjay.bsebmath10"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "1.6"
    }

    signingConfigs {
        release {
            if (project.hasProperty('BSEBMATH_STORE_FILE')) {
                storeFile file(BSEBMATH_STORE_FILE)
                storePassword BSEBMATH_STORE_PASSWORD
                keyAlias BSEBMATH_KEY_ALIAS
                keyPassword BSEBMATH_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('BSEBMATH_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
