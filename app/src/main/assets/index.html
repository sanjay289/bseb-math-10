<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>गणित 10 BSEB</title>
<style>
  :root { --brand:#1F4E8C; --accent:#1F4E8C; --bg:#F4F6FA; --card:#fff; --ink:#1b1f27; --muted:#5d6675; --line:#d5dbe5; --th:#e8eef8;
          --ok:#1d7a3a; --ok-bg:#e6f4ea; --bad:#b3261e; --bad-bg:#fce8e6; --explain:#f0f7f2; --done:#1d7a3a; --danger:#b3261e; }
  :root[data-theme="dark"] { --brand:#2E5FA3; --accent:#8AB4F8; --bg:#121418; --card:#1E2128; --ink:#E6E8EC; --muted:#9AA3B2; --line:#3A3F4A; --th:#263042;
          --ok:#81C995; --ok-bg:#1E3326; --bad:#F28B82; --bad-bg:#3A1F1E; --explain:#1E3326; --done:#2E7D46; --danger:#C5372C; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, "Noto Sans Devanagari", sans-serif; background:var(--bg); color:var(--ink); font-size:17px; line-height:1.5; }
  header { background:var(--brand); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:1; }
  header h1 { font-size:19px; margin:0; flex:1; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:6px 12px; font-size:15px; }
  main { padding:14px 16px 40px; max-width:720px; margin:0 auto; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs a { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:10px 4px; border-radius:10px; background:var(--card); color:var(--accent); text-decoration:none; font-weight:600; font-size:15px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .tabs a.on { background:var(--brand); color:#fff; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  a.card { display:flex; align-items:center; gap:12px; color:inherit; text-decoration:none; }
  .num { background:var(--brand); color:#fff; border-radius:50%; width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .num.done { background:var(--done); }
  .grow { flex:1; }
  .prog { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:6px; }
  .prog i { display:block; height:100%; background:var(--ok); }
  .link { background:none; border:0; color:var(--bad); font-size:14px; padding:8px 0 0; text-decoration:underline; }
  .row { display:flex; gap:8px; }
  .btn.danger { background:var(--danger); }
  .sub { color:var(--muted); font-size:14px; }
  h2 { font-size:20px; margin:4px 0 12px; color:var(--accent); }
  ul.notes { padding-left:20px; margin:0; }
  ul.notes li { margin-bottom:8px; position:relative; padding-right:34px; }
  .star { position:absolute; right:0; top:-4px; background:none; border:0; font-size:22px; line-height:1.4; padding:0 4px; color:var(--muted); }
  .star.on { color:#F4B400; }
  .saved { position:relative; padding-right:44px; }
  .saved .star { right:8px; top:10px; }
  .saved a { color:inherit; text-decoration:none; display:block; }
  table { border-collapse:collapse; width:100%; font-size:15px; }
  td, th { border:1px solid var(--line); padding:6px; text-align:center; }
  th { background:var(--th); }
  .btn { display:block; width:100%; background:var(--brand); color:#fff; border:0; border-radius:10px; padding:13px; font-size:17px; font-weight:600; margin-top:10px; text-align:center; text-decoration:none; }
  .btn.ghost { background:var(--card); color:var(--accent); border:2px solid var(--accent); }
  .opt { display:block; width:100%; text-align:left; background:var(--card); border:2px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px; font-size:17px; color:var(--ink); }
  .opt.right { border-color:var(--ok); background:var(--ok-bg); }
  .opt.wrong { border-color:var(--bad); background:var(--bad-bg); }
  .bar { display:flex; justify-content:space-between; color:var(--muted); font-size:14px; margin-bottom:8px; }
  .explain { border-left:4px solid var(--ok); padding:8px 12px; background:var(--explain); border-radius:6px; margin-top:6px; }
  #search { width:100%; padding:12px; font-size:17px; border:2px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); margin-bottom:12px; }
  #search:focus { outline:none; border-color:var(--accent); }
  .big { font-size:44px; font-weight:800; color:var(--accent); text-align:center; margin:10px 0 0; }
</style>
</head>

let lang = 'hi';

function best(key) { try { return JSON.parse(localStorage.getItem('best') || '{}')[key]; } catch (e) { return undefined; } }
function saveBest(key, pct) {
  try {
    const b = JSON.parse(localStorage.getItem('best') || '{}');
    if (b[key] === undefined || pct > b[key]) { b[key] = pct; localStorage.setItem('best', JSON.stringify(b)); }
  } catch (e) {}
}

// Progress: per chapter, the questions answered correctly at least once (keyed by Hindi question text).
let prog = {};
try { prog = JSON.parse(localStorage.getItem('progress') || '{}'); } catch (e) {}
const QCH = new Map();
CH.forEach((c, i) => c.q.forEach(q => QCH.set(q[0][0], i)));

function solved(i) { return (prog[i] || []).filter(k => QCH.get(k) === i).length; }

function record(q) {
  const i = QCH.get(q[0][0]);
  const a = prog[i] || (prog[i] = []);
  if (a.includes(q[0][0])) return;
  a.push(q[0][0]);
  try { localStorage.setItem('progress', JSON.stringify(prog)); } catch (e) {}
}

function chapterList() {
  const all = CH.reduce((s, c) => s + c.q.length, 0);
  const tot = CH.reduce((s, c, i) => s + solved(i), 0);
  const done = CH.filter((c, i) => solved(i) === c.q.length).length;
  const summary = `<div class="card"><b>${L('आपकी प्रगति','Your progress')}</b><br><span class="sub">${tot}/${all} ${L('प्रश्न सही हल किए','questions solved')} (${Math.round(100 * tot / all)}%) · ${done}/${CH.length} ${L('अध्याय पूरे','chapters complete')}</span>${bar(tot, all)}${resetUi(tot > 0 || best('mock') !== undefined || CH.some((c, i) => best('c' + i) !== undefined))}</div>`;
  return summary + CH.map((c, i) => {
    const b = best('c' + i), s = solved(i), n = c.q.length;

  }).join('');
}

// Formula search: matches both languages; superscripts/subscripts and spaces are ignored so "sin2" finds "sin²".
let query = '';
const FROM = '²³ⁿᵐ₁₂₃−', TO = '23nm123-';
const norm = s => s.toLowerCase().replace(/[²³ⁿᵐ₁₂₃−]/g, c => TO[FROM.indexOf(c)]).replace(/\s+/g, '');
const trigRow = (r, k) => `${r[0]}: ` + TRIG[0].slice(1).map((a, j) => `${a} = ${Array.isArray(r[j + 1]) ? r[j + 1][k] : r[j + 1]}`).join(', ');

function results() {
  const terms = query.split(/\s+/).map(norm).filter(Boolean);
  const hits = [];
  CH.forEach((c, i) => {
    const notes = c.table ? c.n.concat(TRIG.slice(1).map(r => [trigRow(r, 0), trigRow(r, 1)])) : c.n;
    notes.forEach(x => {
      const hay = norm(x[0] + x[1] + c.t[0] + c.t[1]);
      if (terms.every(t => hay.includes(t))) hits.push([i, x]);
    });
  });
  if (!hits.length) return `<p class="sub">${L('कोई सूत्र नहीं मिला।','No formulas found.')}</p>`;
  return `<p class="sub">${hits.length} ${L('परिणाम','results')}</p>` + hits.map(([i, x]) =>
    `<a class="card" href="#/ch/${i}"><span><span class="sub">${i + 1}. ${esc(T(CH[i].t))}</span><br>${esc(T(x))}</span></a>`).join('');
}

function search(v) {
  query = v;
  $('results').innerHTML = query.trim() ? results() : chapterList();
}

function home() {
  return tabs('#/') + `<input id="search" type="search" value="${esc(query)}" oninput="search(this.value)" placeholder="${L('🔍 सूत्र खोजें — जैसे sin, क्षेत्रफल, AP','🔍 Search formulas — e.g. sin, area, AP')}">`
    + `<div id="results">${query.trim() ? results() : chapterList()}</div>`;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Active quiz: list of questions, current index, score, chosen option for the current question.
let quiz = null;
const MOCK_SIZE = 25;

function startQuiz(key) {
  const qs = key === 'mock'
    ? shuffle(CH.flatMap(c => c.q)).slice(0, MOCK_SIZE)
    : shuffle(CH[+key].q.slice());
  // Shuffle options too, so the correct answer isn't always in the same slot.
  const mixed = qs.map(([q, opts, ans, ex]) => {
    const order = shuffle([0, 1, 2, 3]);
    return [q, order.map(k => opts[k]), order.indexOf(ans), ex];
  });
  quiz = { key, qs: mixed, i: 0, score: 0, picked: null, start: Date.now() };
}

function quizView() {
  const z = quiz;
  if (z.i >= z.qs.length) return result();
  const [q, opts, ans, ex] = z.qs[z.i];
  const timer = z.key === 'mock' ? `<span id="timer">${elapsed()}</span>` : '';
  let h = `<div class="bar"><span>${L('प्रश्न','Question')} ${z.i + 1}/${z.qs.length}</span>${timer}<span>${L('अंक','Score')}: ${z.score}</span></div>`
    + `<div class="card"><b>${esc(T(q))}</b></div>`;
  opts.forEach((o, k) => {
    let cls = 'opt';
    if (z.picked !== null) { if (k === ans) cls += ' right'; else if (k === z.picked) cls += ' wrong'; }
    h += `<button class="${cls}" onclick="pick(${k})">${'abcd'[k]}) ${esc(T(o))}</button>`;
  });
  if (z.picked !== null) {
    h += `<div class="explain">${z.picked === ans ? L('✔ सही!','✔ Correct!') : L('✘ गलत।','✘ Wrong.')} ${esc(T(ex))}</div>`
      + `<button class="btn" onclick="next()">${z.i + 1 < z.qs.length ? L('अगला प्रश्न →','Next →') : L('परिणाम देखें','See result')}</button>`;
  }
  return h;
}

function elapsed() {
  const s = Math.floor((Date.now() - quiz.start) / 1000);
  return `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function pick(k) {
  if (quiz.picked !== null) return;
  quiz.picked = k;
  if (k === quiz.qs[quiz.i][2]) { quiz.score++; record(quiz.qs[quiz.i]); }
  render();
}

function next() { quiz.i++; quiz.picked = null; render(); window.scrollTo(0, 0); }

function result() {
  const z = quiz, pct = Math.round(100 * z.score / z.qs.length);
  if (!z.saved) { saveBest(z.key === 'mock' ? 'mock' : 'c' + z.key, pct); z.saved = true; }
  const msg = pct >= 80 ? L('शानदार! 🎉','Excellent! 🎉') : pct >= 50 ? L('अच्छा है, थोड़ा और अभ्यास करें।','Good, practise a bit more.') : L('सूत्र दोहराकर फिर प्रयास करें।','Revise the formulas and try again.');
  const title = z.key === 'mock' ? L('मॉक टेस्ट','Mock test') : T(CH[+z.key].t);
  const time = z.key === 'mock' ? `<p class="sub" style="text-align:center">${elapsed()}</p>` : '';
  return `<h2>${esc(title)}</h2><div class="card"><p class="big">${z.score}/${z.qs.length}</p><p style="text-align:center">${pct}% — ${msg}</p>${time}</div>`
    + `<button class="btn" onclick="retry()">${L('फिर से प्रयास करें','Try again')}</button>`
    + `<button class="btn ghost" onclick="shareScore(${z.score},${z.qs.length})">${L('स्कोर शेयर करें','Share score')}</button>`
    + `<a class="btn ghost" href="#/">${L('अध्याय सूची','Chapter list')}</a>`;
}

function retry() { startQuiz(quiz.key); render(); }

function shareScore(s, n) {
  const text = L(`मैंने "गणित 10 BSEB" ऐप में ${n} में से ${s} अंक पाए!`, `I scored ${s}/${n} on the "Maths 10 BSEB" app!`);
  if (window.Android) Android.share(text);
}

function mockIntro() {
  const b = best('mock');
  return tabs('#/mock') + `<div class="card"><b>${L('मिश्रित मॉक टेस्ट','Mixed mock test')}</b><p>${L(`सभी 14 अध्यायों से ${MOCK_SIZE} यादृच्छिक प्रश्न, समय के साथ। हर बार नए प्रश्न।`, `${MOCK_SIZE} random questions from all 14 chapters, timed. Different every time.`)}</p>`
    + (b !== undefined ? `<p class="sub">${L('सर्वश्रेष्ठ','Best')}: ${b}%</p>` : '') + `</div><a class="btn" href="#/quiz/mock">${L('टेस्ट शुरू करें','Start test')}</a>`;
}

function tipsView() {
  return tabs('#/tips') + `<div class="card"><b>${L('बोर्ड परीक्षा के लिए सुझाव','Board exam tips')}</b><ul class="notes">`
    + TIPS.map(x => `<li>${esc(T(x))}</li>`).join('') + '</ul></div>'
    + `<p class="sub">${L('यह ऐप NCERT/BSEB कक्षा 10 गणित पाठ्यक्रम पर आधारित अभ्यास के लिए है। आधिकारिक सिलेबस और परीक्षा पैटर्न के लिए biharboardonline.bihar.gov.in देखें।','This app is for practice based on the NCERT/BSEB Class 10 maths syllabus. See biharboardonline.bihar.gov.in for the official syllabus and exam pattern.')}</p>`;
}

let tick = null;
function render() {
  const r = location.hash.replace(/^#\/?/, '').split('/');
  $('langBtn').textContent = lang === 'hi' ? 'English' : 'हिंदी';
  $('themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
  $('title').textContent = L('गणित कक्षा 10 · बिहार बोर्ड', 'Maths Class 10 · Bihar Board');
  clearInterval(tick);
  let h;
  if (r[0] === 'ch') h = chapter(+r[1]);
  else if (r[0] === 'quiz') {
    if (!quiz || quiz.key !== r[1]) startQuiz(r[1]);
    h = quizView();
    if (quiz.key === 'mock' && quiz.i < quiz.qs.length) tick = setInterval(() => { const t = $('timer'); if (t) t.textContent = elapsed(); }, 1000);
  }
  else if (r[0] === 'mock') h = mockIntro();
  else if (r[0] === 'tips') h = tipsView();
  else if (r[0] === 'saved') h = savedView();
  else h = home();
  if (r[0] !== 'quiz') quiz = null;
  if (r[0]) confirmReset = false;
  $('app').innerHTML = h;
}

window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.documentElement.lang = lang;
document.documentElement.dataset.theme = theme;
render();
</script>
</body>
</html>
