<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>गणित 10 BSEB</title>
<style>
  :root { --blue:#1F4E8C; --bg:#F4F6FA; --card:#fff; --ink:#1b1f27; --muted:#5d6675; --ok:#1d7a3a; --bad:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, "Noto Sans Devanagari", sans-serif; background:var(--bg); color:var(--ink); font-size:17px; line-height:1.5; }
  header { background:var(--blue); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:1; }
  header h1 { font-size:19px; margin:0; flex:1; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:6px 12px; font-size:15px; }
  main { padding:14px 16px 40px; max-width:720px; margin:0 auto; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs a { flex:1; text-align:center; padding:10px 4px; border-radius:10px; background:var(--card); color:var(--blue); text-decoration:none; font-weight:600; font-size:15px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .tabs a.on { background:var(--blue); color:#fff; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  a.card { display:flex; align-items:center; gap:12px; color:inherit; text-decoration:none; }
  .num { background:var(--blue); color:#fff; border-radius:50%; width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .sub { color:var(--muted); font-size:14px; }
  h2 { font-size:20px; margin:4px 0 12px; color:var(--blue); }
  ul.notes { padding-left:20px; margin:0; }
  ul.notes li { margin-bottom:8px; }
  table { border-collapse:collapse; width:100%; font-size:15px; }
  td, th { border:1px solid #d5dbe5; padding:6px; text-align:center; }
  th { background:#e8eef8; }
  .btn { display:block; width:100%; background:var(--blue); color:#fff; border:0; border-radius:10px; padding:13px; font-size:17px; font-weight:600; margin-top:10px; text-align:center; text-decoration:none; }
  .btn.ghost { background:var(--card); color:var(--blue); border:2px solid var(--blue); }
  .opt { display:block; width:100%; text-align:left; background:var(--card); border:2px solid #d5dbe5; border-radius:10px; padding:12px; margin-bottom:8px; font-size:17px; color:var(--ink); }
  .opt.right { border-color:var(--ok); background:#e6f4ea; }
  .opt.wrong { border-color:var(--bad); background:#fce8e6; }
  .bar { display:flex; justify-content:space-between; color:var(--muted); font-size:14px; margin-bottom:8px; }
  .explain { border-left:4px solid var(--ok); padding:8px 12px; background:#f0f7f2; border-radius:6px; margin-top:6px; }
  .big { font-size:44px; font-weight:800; color:var(--blue); text-align:center; margin:10px 0 0; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>

    [["वर्ग 10–20 का वर्ग चिह्न:","Class mark of the class 10–20:"],["10","15","20","30"],1,"(10 + 20)/2 = 15"]
   ]},
 { t:["प्रायिकता","Probability"],
   n:[
    ["P(E) = अनुकूल परिणामों की संख्या / कुल संभावित परिणामों की संख्या","P(E) = number of favourable outcomes / total number of outcomes"],
    ["0 ≤ P(E) ≤ 1; निश्चित घटना = 1, असंभव घटना = 0","0 ≤ P(E) ≤ 1; sure event = 1, impossible event = 0"],
    ["P(E) + P(E नहीं) = 1","P(E) + P(not E) = 1"],
    ["सिक्का: 2 परिणाम; दो सिक्के: 4; पासा: 6; दो पासे: 36","Coin: 2 outcomes; two coins: 4; die: 6; two dice: 36"],
    ["ताश: 52 पत्ते, 26 लाल, 26 काले, 4 इक्के, 12 फेस कार्ड","Deck: 52 cards, 26 red, 26 black, 4 aces, 12 face cards"]
   ],
   q:[
    [["एक सिक्का उछालने पर चित आने की प्रायिकता:","Probability of a head when a coin is tossed:"],["0","1/2","1","2"],1,"1/2"],
    [["पासा फेंकने पर अभाज्य संख्या आने की प्रायिकता:","Probability of a prime number when a die is thrown:"],["1/6","1/3","1/2","2/3"],2,"{2, 3, 5} ⇒ 3/6 = 1/2"],
    [["यदि P(E) = 0.3, तो P(E नहीं) =","If P(E) = 0.3, then P(not E) ="],["0.3","0.7","1","0"],1,"1 − 0.3 = 0.7"],
    [["असंभव घटना की प्रायिकता:","Probability of an impossible event:"],["0","1","−1","1/2"],0,"0"],
    [["52 पत्तों की ताश से इक्का निकलने की प्रायिकता:","Probability of drawing an ace from a 52-card deck:"],["1/52","1/13","1/4","4/13"],1,"4/52 = 1/13"],
    [["दो सिक्के उछालने पर कम से कम एक चित आने की प्रायिकता:","Two coins are tossed. Probability of at least one head:"],["1/4","1/2","3/4","1"],2,"{HH, HT, TH} ⇒ 3/4"],
    [["दो पासे फेंकने पर योग 7 आने की प्रायिकता:","Two dice are thrown. Probability that the sum is 7:"],["1/6","1/36","7/36","1/12"],0,"(1,6)(2,5)(3,4)(4,3)(5,2)(6,1) ⇒ 6/36 = 1/6"],
    [["निम्न में से कौन किसी घटना की प्रायिकता नहीं हो सकती?","Which of these cannot be the probability of an event?"],["0.7","2/3","1.5","0"],2,["प्रायिकता 1 से अधिक नहीं हो सकती","Probability cannot exceed 1"]]
   ]}
];

const TRIG = [["θ","0°","30°","45°","60°","90°"],
  ["sin","0","1/2","1/√2","√3/2","1"],
  ["cos","1","√3/2","1/√2","1/2","0"],
  ["tan","0","1/√3","1","√3",["अपरिभाषित","undefined"]]];

const TIPS = [
  ["प्रश्न-पत्र में दो भाग होते हैं: वस्तुनिष्ठ (MCQ, OMR शीट पर) और विषयनिष्ठ (लघु एवं दीर्घ उत्तरीय)। ताज़ा पैटर्न के लिए BSEB का मॉडल पेपर अवश्य देखें।","The paper has two parts: objective (MCQs on an OMR sheet) and subjective (short and long answers). Always check the latest BSEB model paper for the current pattern."],
  ["MCQ में दिए गए विकल्पों से अधिक प्रश्न होते हैं — पहले वे प्रश्न करें जो पक्के आते हैं।","The MCQ section offers more questions than you must attempt — do the ones you are sure of first."],
  ["OMR शीट पर गोला पूरा और साफ़ भरें; काटकर दोबारा न भरें।","Fill OMR bubbles completely and neatly; never overwrite."],
  ["सूत्र रोज़ एक बार दोहराएँ — इस ऐप का हर अध्याय पहले सूत्र दिखाता है।","Revise formulas daily — every chapter in this app shows its formulas first."],
  ["दीर्घ उत्तरीय प्रश्नों में हर चरण लिखें; चरणों के भी अंक मिलते हैं।","Write every step in long answers; steps earn marks too."],
  ["त्रिकोणमिति की मान-सारणी और सर्वसमिकाएँ पूरी तरह याद करें।","Memorise the trig value table and identities completely."],
  ["पिछले वर्षों के प्रश्न-पत्र हल करें और घड़ी लगाकर अभ्यास करें।","Solve previous years' papers with a timer."],
  ["परीक्षा से पहले अच्छी नींद लें, एडमिट कार्ड और पेन एक दिन पहले रख लें।","Sleep well before the exam; keep your admit card and pens ready the day before."]
];

let lang = 'hi';
try { lang = localStorage.getItem('lang') || 'hi'; } catch (e) {}
const T = x => Array.isArray(x) ? x[lang === 'hi' ? 0 : 1] : x;
const L = (hi, en) => lang === 'hi' ? hi : en;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

function best(key) { try { return JSON.parse(localStorage.getItem('best') || '{}')[key]; } catch (e) { return undefined; } }
function saveBest(key, pct) {
  try {
    const b = JSON.parse(localStorage.getItem('best') || '{}');
    if (b[key] === undefined || pct > b[key]) { b[key] = pct; localStorage.setItem('best', JSON.stringify(b)); }
  } catch (e) {}
}

function toggleLang() {
  lang = lang === 'hi' ? 'en' : 'hi';
  try { localStorage.setItem('lang', lang); } catch (e) {}
  document.documentElement.lang = lang;
  render();
}

function tabs(on) {
  const t = [['#/', L('अध्याय','Chapters')], ['#/mock', L('मॉक टेस्ट','Mock Test')], ['#/tips', L('टिप्स','Tips')]];
  return '<div class="tabs">' + t.map(([h, s]) => `<a href="${h}" class="${h === on ? 'on' : ''}">${s}</a>`).join('') + '</div>';
}

function home() {
  return tabs('#/') + CH.map((c, i) => {
    const b = best('c' + i);
    const sub = `${c.q.length} ${L('प्रश्न','questions')}` + (b !== undefined ? ` · ${L('सर्वश्रेष्ठ','best')} ${b}%` : '');
    return `<a class="card" href="#/ch/${i}"><span class="num">${i + 1}</span><span><b>${esc(T(c.t))}</b><br><span class="sub">${sub}</span></span></a>`;
  }).join('');
}

function chapter(i) {
  const c = CH[i];
  let h = `<h2>${i + 1}. ${esc(T(c.t))}</h2><div class="card"><b>${L('मुख्य सूत्र एवं तथ्य','Key formulas & facts')}</b><ul class="notes">`
    + c.n.map(x => `<li>${esc(T(x))}</li>`).join('') + '</ul></div>';
  if (c.table) {
    h += '<div class="card"><table>' + TRIG.map((r, k) =>
      '<tr>' + r.map(v => k === 0 ? `<th>${esc(T(v))}</th>` : `<td>${esc(T(v))}</td>`).join('') + '</tr>').join('') + '</table></div>';
  }
  return h + `<a class="btn" href="#/quiz/${i}">${L('अभ्यास प्रश्न शुरू करें','Start practice quiz')} (${c.q.length})</a>`;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Active quiz: list of questions, current index, score, chosen option for the current question.
let quiz = null;
const MOCK_SIZE = 25;

function startQuiz(key) {
  const qs = key === 'mock'
    ? shuffle(CH.flatMap(c => c.q)).slice(0, MOCK_SIZE)
    : shuffle(CH[+key].q.slice());
  // Shuffle options too, so the correct answer isn't always in the same slot.
  const mixed = qs.map(([q, opts, ans, ex]) => {
    const order = shuffle([0, 1, 2, 3]);
    return [q, order.map(k => opts[k]), order.indexOf(ans), ex];
  });
  quiz = { key, qs: mixed, i: 0, score: 0, picked: null, start: Date.now() };
}

function quizView() {
  const z = quiz;
  if (z.i >= z.qs.length) return result();
  const [q, opts, ans, ex] = z.qs[z.i];
  const timer = z.key === 'mock' ? `<span id="timer">${elapsed()}</span>` : '';
  let h = `<div class="bar"><span>${L('प्रश्न','Question')} ${z.i + 1}/${z.qs.length}</span>${timer}<span>${L('अंक','Score')}: ${z.score}</span></div>`
    + `<div class="card"><b>${esc(T(q))}</b></div>`;
  opts.forEach((o, k) => {
    let cls = 'opt';
    if (z.picked !== null) { if (k === ans) cls += ' right'; else if (k === z.picked) cls += ' wrong'; }
    h += `<button class="${cls}" onclick="pick(${k})">${'abcd'[k]}) ${esc(T(o))}</button>`;
  });
  if (z.picked !== null) {
    h += `<div class="explain">${z.picked === ans ? L('✔ सही!','✔ Correct!') : L('✘ गलत।','✘ Wrong.')} ${esc(T(ex))}</div>`
      + `<button class="btn" onclick="next()">${z.i + 1 < z.qs.length ? L('अगला प्रश्न →','Next →') : L('परिणाम देखें','See result')}</button>`;
  }
  return h;
}

function elapsed() {
  const s = Math.floor((Date.now() - quiz.start) / 1000);
  return `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function pick(k) {
  if (quiz.picked !== null) return;
  quiz.picked = k;
  if (k === quiz.qs[quiz.i][2]) quiz.score++;
  render();
}

function next() { quiz.i++; quiz.picked = null; render(); window.scrollTo(0, 0); }

function result() {
  const z = quiz, pct = Math.round(100 * z.score / z.qs.length);
  if (!z.saved) { saveBest(z.key === 'mock' ? 'mock' : 'c' + z.key, pct); z.saved = true; }
  const msg = pct >= 80 ? L('शानदार! 🎉','Excellent! 🎉') : pct >= 50 ? L('अच्छा है, थोड़ा और अभ्यास करें।','Good, practise a bit more.') : L('सूत्र दोहराकर फिर प्रयास करें।','Revise the formulas and try again.');
  const title = z.key === 'mock' ? L('मॉक टेस्ट','Mock test') : T(CH[+z.key].t);
  const time = z.key === 'mock' ? `<p class="sub" style="text-align:center">${elapsed()}</p>` : '';
  return `<h2>${esc(title)}</h2><div class="card"><p class="big">${z.score}/${z.qs.length}</p><p style="text-align:center">${pct}% — ${msg}</p>${time}</div>`
    + `<button class="btn" onclick="retry()">${L('फिर से प्रयास करें','Try again')}</button>`
    + `<button class="btn ghost" onclick="shareScore(${z.score},${z.qs.length})">${L('स्कोर शेयर करें','Share score')}</button>`
    + `<a class="btn ghost" href="#/">${L('अध्याय सूची','Chapter list')}</a>`;
}

function retry() { startQuiz(quiz.key); render(); }

function shareScore(s, n) {
  const text = L(`मैंने "गणित 10 BSEB" ऐप में ${n} में से ${s} अंक पाए!`, `I scored ${s}/${n} on the "Maths 10 BSEB" app!`);
  if (window.Android) Android.share(text);
}

function mockIntro() {
  const b = best('mock');
  return tabs('#/mock') + `<div class="card"><b>${L('मिश्रित मॉक टेस्ट','Mixed mock test')}</b><p>${L(`सभी 14 अध्यायों से ${MOCK_SIZE} यादृच्छिक प्रश्न, समय के साथ। हर बार नए प्रश्न।`, `${MOCK_SIZE} random questions from all 14 chapters, timed. Different every time.`)}</p>`
    + (b !== undefined ? `<p class="sub">${L('सर्वश्रेष्ठ','Best')}: ${b}%</p>` : '') + `</div><a class="btn" href="#/quiz/mock">${L('टेस्ट शुरू करें','Start test')}</a>`;
}

function tipsView() {
  return tabs('#/tips') + `<div class="card"><b>${L('बोर्ड परीक्षा के लिए सुझाव','Board exam tips')}</b><ul class="notes">`
    + TIPS.map(x => `<li>${esc(T(x))}</li>`).join('') + '</ul></div>'
    + `<p class="sub">${L('यह ऐप NCERT/BSEB कक्षा 10 गणित पाठ्यक्रम पर आधारित अभ्यास के लिए है। आधिकारिक सिलेबस और परीक्षा पैटर्न के लिए biharboardonline.bihar.gov.in देखें।','This app is for practice based on the NCERT/BSEB Class 10 maths syllabus. See biharboardonline.bihar.gov.in for the official syllabus and exam pattern.')}</p>`;
}

let tick = null;
function render() {
  const r = location.hash.replace(/^#\/?/, '').split('/');
  $('langBtn').textContent = lang === 'hi' ? 'English' : 'हिंदी';
  $('title').textContent = L('गणित कक्षा 10 · बिहार बोर्ड', 'Maths Class 10 · Bihar Board');
  clearInterval(tick);
  let h;
  if (r[0] === 'ch') h = chapter(+r[1]);
  else if (r[0] === 'quiz') {
    if (!quiz || quiz.key !== r[1]) startQuiz(r[1]);
    h = quizView();
    if (quiz.key === 'mock' && quiz.i < quiz.qs.length) tick = setInterval(() => { const t = $('timer'); if (t) t.textContent = elapsed(); }, 1000);
  }
  else if (r[0] === 'mock') h = mockIntro();
  else if (r[0] === 'tips') h = tipsView();
  else h = home();
  if (r[0] !== 'quiz') quiz = null;
  $('app').innerHTML = h;
}

window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.documentElement.lang = lang;
render();
</script>
</body>
</html>
